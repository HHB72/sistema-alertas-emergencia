<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - App de Emergencia</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <div class="container">
        <h2>CREAR CUENTA</h2>

        {% if form.errors %}
            <div class="status-box" style="background-color: #f8d7da; color: #721c24; border-color: #f5c6cb; font-size: 0.9rem; text-align: left;">
                Por favor, revisá los datos ingresados.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}:</label>
                    {{ field }}
                    {% if field.errors %}
                        <small style="color: #e74c3c; font-weight: bold; display: block; margin-top: 4px;">
                            {{ field.errors.0 }}
                        </small>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit" class="btn" style="background-color: #27ae60; margin-top: 10px;">Registrarse</button>
        </form>

        <a href="{% url 'login' %}" class="btn" style="background-color: #2980b9; margin-top: 10px;">¿Ya tenés cuenta? Iniciar Sesión</a>
        <a href="{% url 'index' %}" class="btn btn-back">Volver al inicio</a>
    </div>
</body>
</html>
