<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospitales Cercanos</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <div class="container">
        <h2>HOSPITALES Y GUARDIAS CERCANAS</h2>
        <p style="margin-bottom: 15px;">Mapa interactivo con las guardias médicas e centros de salud de la zona:</p>

        <!-- Mapa de Google Maps embebido buscando hospitales en la zona -->
        <div style="width: 100%; height: 300px; margin-bottom: 20px; border-radius: 8px; overflow: hidden;">
            <iframe 
                width="100%" 
                height="100%" 
                style="border:0" 
                loading="lazy" 
                allowfullscreen 
                src="https://maps.google.com/maps?q=hospitales+y+guardias&t=&z=13&ie=UTF8&iwloc=&output=embed">
            </iframe>
        </div>

        <a href="https://www.google.com/maps/search/hospitales+y+guardias" target="_blank" class="btn" style="background-color: #2980b9; text-align: center; display: block; margin-bottom: 10px;">
            Abrir en Google Maps
        </a>

        <a href="{% url 'index' %}" class="btn btn-back">Volver al inicio</a>
    </div>
</body>
</html>
