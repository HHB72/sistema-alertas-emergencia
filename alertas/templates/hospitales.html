<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospitales Cercanos</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <div class="container">
        <h2>HOSPITALES Y GUARDIAS CERCANAS</h2>
        <p style="margin-bottom: 15px;">Mapa interactivo con las guardias médicas y centros de salud de la zona:</p>

        <!-- Botón interactivo con Lenguaje Cliente (JavaScript) para buscar desde la ubicación actual -->
        <div style="margin-bottom: 20px; text-align: center;">
            <button onclick="buscarHospitalesCercanos()" class="btn" style="background-color: #27ae60; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px;">
                📍 Buscar Hospital Usando Mi Ubicación Actual
            </button>
            <p id="estado-ubicacion" style="margin-top: 10px; font-weight: bold; font-size: 14px;"></p>
        </div>

        <!-- Mapa de Google Maps embebido buscando hospitales en la zona -->
        <div style="width: 100%; height: 300px; margin-bottom: 20px; border-radius: 8px; overflow: hidden;">
            <iframe 
                width="100%" 
                height="100%" 
                style="border:0" 
                loading="lazy" 
                allowfullscreen 
                src="https://maps.google.com/maps?q=hospitales+y+guardias&t=&z=13&ie=UTF8&iwloc=&output=embed">
            </iframe>
        </div>

        <a href="https://www.google.com/maps/search/hospitales+y+guardias" target="_blank" class="btn" style="background-color: #2980b9; text-align: center; display: block; margin-bottom: 10px; text-decoration: none; color: white; padding: 10px; border-radius: 5px;">
            Abrir en Google Maps
        </a>

        <a href="{% url 'index' %}" class="btn btn-back" style="text-align: center; display: block; text-decoration: none;">Volver al inicio</a>
    </div>

    <!-- [INICIO DE CÓDIGO CLIENTE / JAVASCRIPT - Geolocalización] -->
    <script>
        function buscarHospitalesCercanos() {
            const estado = document.getElementById('estado-ubicacion');
            
            if (!navigator.geolocation) {
                estado.innerText = "Tu navegador no soporta geolocalización.";
                return;
            }

            estado.innerText = "Obteniendo tu ubicación actual...";

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    
                    estado.innerText = "¡Ubicación obtenida! Abriendo mapa de hospitales cercanos...";
                    
                    // Abre Google Maps pasando las coordenadas exactas del usuario
                    const urlMaps = `https://www.google.com/maps/search/hospital/@${lat},${lon},15z`;
                    window.open(urlMaps, '_blank');
                },
                () => {
                    estado.innerText = "No se pudo obtener tu ubicación. Verifica los permisos del navegador.";
                }
            );
        }
    </script>
    <!-- [FIN DE CÓDIGO CLIENTE] -->
</body>
</html>
