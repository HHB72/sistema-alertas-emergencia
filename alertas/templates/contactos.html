<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactos de Emergencia</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <div class="container">
        <h2>CONTACTOS DE EMERGENCIA</h2>
        
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej. Mamá / Juan" required>
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono" placeholder="Ej. 3511234567" required>
            </div>

            <button type="submit" class="btn" style="background-color: #27ae60;">Guardar Contacto</button>
        </form>

        <h3 style="margin-top: 25px;">Lista de contactos</h3>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Nombre</th>
                    <th>Teléfono</th>
                </tr>
            </thead>
            <tbody>
                {% for contacto in contactos %}
                    <tr>
                        <td>{{ forloop.counter }}</td>
                        <td>{{ contacto.nombre }}</td>
                        <td>{{ contacto.telefono }}</td>
                    </tr>
                {% empty %}
                    <tr>
                        <td colspan="3">No tienes contactos de emergencia guardados.</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>

        <a href="{% url 'index' %}" class="btn btn-back">Volver al inicio</a>
    </div>
</body>
</html>
