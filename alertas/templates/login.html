<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - App de Emergencia</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <div class="container">
        <h2>INICIAR SESIÓN</h2>

        {% if form.errors %}
            <div class="status-box" style="background-color: #f8d7da; color: #721c24; border-color: #f5c6cb; font-size: 0.95rem;">
                Usuario o contraseña incorrectos.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">Usuario:</label>
                <input type="text" name="username" id="id_username" required autofocus>
            </div>

            <div class="form-group">
                <label for="id_password">Contraseña:</label>
                <input type="password" name="password" id="id_password" required>
            </div>

            <button type="submit" class="btn" style="background-color: #2980b9; margin-top: 10px;">Ingresar</button>
        </form>

        <a href="{% url 'registro' %}" class="btn" style="background-color: #27ae60; margin-top: 10px;">Crear Cuenta Nueva</a>
        <a href="{% url 'index' %}" class="btn btn-back">Volver al inicio</a>
    </div>
</body>
</html>
