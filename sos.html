<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOS - Alerta de Emergencia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>SOS</h1>
        <button id="sosBtn" class="btn btn-sos">ACTIVAR SOS</button>
        
        <div id="statusBox" class="status-box" style="display: none;">
            Estado: SOS activado. Enviando ubicación a contactos de emergencia...
        </div>

        <a href="index.html" class="btn btn-back">Volver al inicio</a>
    </div>

    <script>
        document.getElementById('sosBtn').addEventListener('click', function() {
            document.getElementById('statusBox').style.display = 'block';
        });
    </script>
</body>
</html>
